[project]
name = "taxi-pipeline"
version = "0.5.0"
description = "Обнаружение аномально долгих поездок такси: DVC-конвейер, MLflow, CI"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["mlruns", "data", "models", "metrics", "reports"]

[tool.ruff.lint]
# E/W — pycodestyle, F — pyflakes (неиспользуемое, ошибки имён), I — порядок импортов,
# B — типичные баги (bugbear), UP — устаревший синтаксис Python
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "data: тесты на полном датасете (нужен dvc pull); без данных пропускаются",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["src", "app"]
omit = ["src/predict.py"]
